<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GetGems Pricer</title>
  <style>
    :root {
      --bg: #0d0d10;
      --card: #16161c;
      --border: #2a2a32;
      --accent: #7c5cfc;
      --accent-hover: #6a4ae0;
      --text: #eeeef2;
      --muted: #888;
      --green: #3dd68c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.35rem; font-weight: 600; }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    select, input {
      width: 100%;
      background: #0f0f12;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 14px;
    }
    select:focus, input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: #3a3a44; margin-top: 8px; }
    button.secondary:hover { background: #4a4a54; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .stats {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }
    .stat {
      flex: 1;
      background: #0f0f12;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat b { display: block; font-size: 1.2rem; }
    .stat span { font-size: 0.75rem; color: var(--muted); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
    tr:hover td { background: #1c1c24; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty {
      text-align: center;
      padding: 40px 10px;
      color: var(--muted);
    }
    .status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    #banList {
      max-height: 200px;
      overflow: auto;
      font-size: 0.8rem;
      color: var(--muted);
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>GetGems Pricer</h1>
    <span style="color:var(--muted);font-size:0.85rem">Telegram Usernames</span>
  </header>

  <div class="layout">
    <div class="panel">
      <h2>Поиск</h2>
      <label>Коллекция</label>
      <select id="collection">
        <option value="all">Все подарки</option>
        <option value="usernames">Telegram Usernames</option>
        <option value="snoop">Snoop Dogg</option>
        <option value="vintage">Vintage Cigars</option>
        <option value="mood">Mood Pack</option>
        <option value="lolpop">Lol Pop</option>
      </select>

      <label>Лимит</label>
      <input type="number" id="limit" value="20" min="1" max="100">

      <button id="searchBtn">Искать</button>
      <button id="resetBtn" class="secondary">Сбросить юзы</button>
      <div class="status" id="status">Готов</div>

      <div class="stats">
        <div class="stat"><b id="total">0</b><span>найдено</span></div>
        <div class="stat"><b id="wallets">0</b><span>кошельков</span></div>
        <div class="stat"><b id="banned">0</b><span>в бане</span></div>
      </div>

      <h2 style="font-size:0.95rem">Кошельки в бане</h2>
      <div id="banList"><div class="empty" style="padding:16px 0">Нет данных</div></div>
    </div>

    <div class="panel">
      <h2>Найденные юзы</h2>
      <button id="copyBtn" class="secondary" style="width:auto;padding:8px 16px;margin-bottom:12px">Скопировать все юзы</button>
      <div id="tableWrap"><div class="empty">Нажми «Искать»</div></div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('searchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const status = document.getElementById('status');
    const tableWrap = document.getElementById('tableWrap');
    const totalEl = document.getElementById('total');
    const walletsEl = document.getElementById('wallets');
    const bannedEl = document.getElementById('banned');
    const banList = document.getElementById('banList');

    let currentResults = [];
    let bannedWallets = {};

    loadAll();
    setInterval(loadBanned, 30000);

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'Обновляю...';
      await loadAll();
      status.textContent = 'Готово';
      btn.disabled = false;
    });

    resetBtn.addEventListener('click', () => {
      if (!currentResults.length) {
        status.textContent = 'Нечего сбрасывать';
        return;
      }
      for (const item of currentResults) {
        if (item.owner) bannedWallets[item.owner] = Date.now();
      }
      localStorage.setItem('bannedWallets', JSON.stringify(bannedWallets));
      currentResults = [];
      render([]);
      renderBanned();
      status.textContent = 'Юзы сброшены, кошельки в бане';
    });

    async function loadAll() {
      await loadResults();
      await loadBanned();
    }

    async function loadResults() {
      try {
        const res = await fetch('results.json?t=' + Date.now());
        if (!res.ok) throw new Error();
        const data = await res.json();
        currentResults = Array.isArray(data) ? data : [];
        render(currentResults);
      } catch {
        currentResults = [];
        render([]);
      }
    }

    async function loadBanned() {
      const local = localStorage.getItem('bannedWallets');
      if (local) {
        try { bannedWallets = JSON.parse(local); } catch {}
      }
      try {
        const res = await fetch('checked_wallets.json?t=' + Date.now());
        if (res.ok) {
          const fileData = await res.json();
          bannedWallets = { ...fileData, ...bannedWallets };
          localStorage.setItem('bannedWallets', JSON.stringify(bannedWallets));
        }
      } catch {}
      renderBanned();
    }

    function renderBanned() {
      const list = Object.keys(bannedWallets);
      bannedEl.textContent = list.length;
      if (!list.length) {
        banList.innerHTML = '<div class="empty" style="padding:16px 0">Нет кошельков в бане</div>';
        return;
      }
      let html = '';
      for (const w of list.slice(-40).reverse()) {
        const short = w.slice(0, 8) + '…' + w.slice(-6);
        html += `<div style="padding:3px 0;border-bottom:1px solid #2a2a32"><code>${short}</code></div>`;
      }
      if (list.length > 40) html += `<div style="padding:6px 0;color:#666">… ещё ${list.length - 40}</div>`;
      banList.innerHTML = html;
    }

    function render(data) {
      if (!data.length) {
        tableWrap.innerHTML = '<div class="empty">Пока ничего не найдено</div>';
        totalEl.textContent = '0';
        walletsEl.textContent = '0';
        return;
      }
      totalEl.textContent = data.length;
      walletsEl.textContent = new Set(data.map(d => d.owner)).size;

      let html = `<table><thead><tr>
        <th>Подарок</th><th>Юзернейм</th><th>Кошелёк</th><th>Когда</th>
      </tr></thead><tbody>`;
      for (const item of data) {
        const date = item.checked_at ? new Date(item.checked_at).toLocaleString('ru-RU') : '—';
        const short = (item.owner || '').slice(0, 10) + '…';
        html += `<tr>
          <td>${esc(item.gift || '—')}</td>
          <td><a href="https://t.me/${item.username}" target="_blank">@${esc(item.username)}</a></td>
          <td><code title="${item.owner || ''}">${short}</code></td>
          <td>${date}</td>
        </tr>`;
      }
      html += '</tbody></table>';
      tableWrap.innerHTML = html;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
    }
  </script>
</body>
</html>
